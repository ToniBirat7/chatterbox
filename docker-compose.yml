services:
  chatterbox-postgres:
    image: postgres:16-alpine
    container_name: chatterbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - chatterbox_pgdata:/var/lib/postgresql/data
    networks:
      - chatterbox_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  chatterbox-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatterbox-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@chatterbox-postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      chatterbox-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3003}:3000"
    networks:
      - chatterbox_network
    deploy:
      resources:
        limits:
          memory: 150M

  chatterbox-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: chatterbox-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3002}:80"
    networks:
      - chatterbox_network
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  chatterbox_pgdata:
    name: chatterbox_pgdata

networks:
  chatterbox_network:
    name: chatterbox_network
    driver: bridge
